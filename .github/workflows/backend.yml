# Builds the backend and runs every test, SQL Server ones included, on each pull request and push to main.
# "Backend tests" is a required check in the "Protect main" ruleset.
name: Backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EvidenceChain.slnx

      - name: Build
        run: dotnet build EvidenceChain.slnx --no-restore

      # The tests' only image, pulled up front with retries: a registry hiccup fails this step, not every database test.
      - name: Pull SQL Server
        run: |
          for attempt in 1 2 3; do
            docker pull mcr.microsoft.com/mssql/server:2025-latest && exit 0
            sleep $((attempt * 20))
          done
          exit 1

      # Testcontainers starts SQL Server 2025 on the runner's Docker; CI=true turns a missing Docker into a failure.
      # Ryuk, its container reaper, comes from Docker Hub, whose timeouts failed whole runs; the runner is discarded
      # after the job, so there is nothing for it to reap.
      - name: Test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: dotnet test --solution EvidenceChain.slnx --no-build
