openapi: '3.1.1'
info:
  title: Evidence Chain API
  description: Chain of custody for digital evidence. Errors use RFC 9457 problem details.
  version: v1
servers:
  - url: http://localhost:8081
    description: docker compose
paths:
  /api/v1/evidence:
    get:
      tags:
        - Evidence
      summary: 'Lists evidence by its latest custody event, one page at a time.'
      parameters:
        - name: q
          in: query
          description: Code prefix (e.g. EML2026) or text in the description.
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - name: type
          in: query
          description: 'LOG, CSV or EML.'
          schema:
            type: string
        - name: custodianId
          in: query
          description: Only evidence this user holds now.
          schema:
            maximum: 2147483647
            minimum: 1
            type: integer
            format: int32
        - name: status
          in: query
          description: 'Only evidence whose last verification found it Unverified, Valid or Invalid.'
          schema:
            $ref: '#/components/schemas/IntegrityStatus'
        - name: sort
          in: query
          description: lastEventAt:desc (default) or lastEventAt:asc.
          schema:
            enum:
              - lastEventAt:desc
              - lastEventAt:asc
            type: string
        - name: cursor
          in: query
          description: 'The nextCursor of the previous page, sent with the same filters and sort.'
          schema:
            maxLength: 64
            minLength: 0
            type: string
        - name: limit
          in: query
          description: 'Rows per page, 1 to 50.'
          schema:
            maximum: 50
            minimum: 1
            type: integer
            format: int32
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPageResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  /api/v1/auth/token:
    post:
      tags:
        - Auth
      summary: Signs in as a seeded demo user and returns a bearer token.
      description: 'Demo sign-in, no password. The role comes from the seeded user, never from the request.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
components:
  schemas:
    EvidenceSummary:
      required:
        - code
        - typeCode
        - description
        - currentCustodian
        - lastEventAtUtc
        - eventCount
        - integrityStatus
        - integrityCheckedAtUtc
        - pendingTransfer
      type: object
      properties:
        code:
          type: string
        typeCode:
          type: string
        description:
          type: string
        currentCustodian:
          $ref: '#/components/schemas/PersonRef'
        lastEventAtUtc:
          type: string
          format: date-time
        eventCount:
          type: integer
          format: int32
        integrityStatus:
          $ref: '#/components/schemas/IntegrityStatus'
        integrityCheckedAtUtc:
          type:
            - 'null'
            - string
          format: date-time
        pendingTransfer:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PendingTransferSummary'
    InboxPageResponse:
      required:
        - items
        - nextCursor
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceSummary'
        nextCursor:
          type:
            - 'null'
            - string
      description: A page of the inbox; nextCursor is null on the last page.
    IntegrityStatus:
      enum:
        - Unverified
        - Valid
        - Invalid
    PendingTransferSummary:
      required:
        - transferId
        - toCustodianId
        - sinceUtc
      type: object
      properties:
        transferId:
          type: integer
          format: int64
        toCustodianId:
          type: integer
          format: int32
        sinceUtc:
          type: string
          format: date-time
    PersonRef:
      required:
        - id
        - displayName
      type: object
      properties:
        id:
          type: integer
          format: int32
        displayName:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
    TokenRequest:
      required:
        - userName
      type: object
      properties:
        userName:
          maxLength: 64
          minLength: 0
          type: string
          description: 'A seeded user name, e.g. investigador.demo or custodio.demo.'
    TokenResponse:
      required:
        - accessToken
        - tokenType
        - expiresAtUtc
        - user
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresAtUtc:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'
      description: 'A bearer token for the Authorization header, when it expires, and who it names.'
    UserRole:
      enum:
        - Investigador
        - Custodio
        - Supervisor
    UserSummary:
      required:
        - id
        - userName
        - displayName
        - role
      type: object
      properties:
        id:
          type: integer
          format: int32
        userName:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  securitySchemes:
    Bearer:
      type: http
      description: Token from POST /api/v1/auth/token.
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Evidence
  - name: Auth