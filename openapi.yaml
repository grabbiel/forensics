openapi: '3.1.1'
info:
  title: Evidence Chain API
  description: Chain of custody for digital evidence. Errors use RFC 9457 problem details.
  version: v1
servers:
  - url: http://localhost:8081
    description: docker compose
paths:
  '/api/v1/custody-transfers/{id}':
    get:
      tags:
        - CustodyTransfers
      summary: 'A transfer as it stands now, with its ETag.'
      parameters:
        - name: id
          in: path
          description: The transfer id.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: The resource's version; send it back as If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResource'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  /api/v1/custody-transfers:
    post:
      tags:
        - CustodyTransfers
      summary: Requests that the evidence's current custodian hand it to another custodian.
      description: "Idempotent per Idempotency-Key: resending the same request answers 201 with the transfer as it is now\n(Idempotent-Replayed: true); the same key with a different request is 422. An evidence has at most one pending\ntransfer; a second request is 409 with the one already pending."
      parameters:
        - name: Idempotency-Key
          in: header
          description: A new UUID for each distinct write; resend the same one to retry safely.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestTransferBody'
          text/json:
            schema:
              $ref: '#/components/schemas/RequestTransferBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RequestTransferBody'
        required: true
      responses:
        '201':
          description: Created
          headers:
            ETag:
              description: The resource's version; send it back as If-Match.
              schema:
                type: string
            Idempotent-Replayed:
              description: '"true" when this answers an earlier request with the same Idempotency-Key.'
              schema:
                type: string
            Location:
              description: Where the created resource can be read.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResource'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TransferConflictProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/custody-transfers/{id}/accept':
    post:
      tags:
        - CustodyTransfers
      summary: The recipient takes custody.
      description: "If-Match must carry the ETag the recipient last read: if the transfer has changed since, the answer is 409 with\nits current state. Idempotent per Idempotency-Key: resending answers 200 with the decision already made."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          description: A new UUID for each distinct write; resend the same one to retry safely.
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          description: 'The ETag of the resource as last read, quotes included; a newer version answers 409.'
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/AcceptTransferBody'
          text/json:
            schema:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/AcceptTransferBody'
          application/*+json:
            schema:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/AcceptTransferBody'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: The resource's version; send it back as If-Match.
              schema:
                type: string
            Idempotent-Replayed:
              description: '"true" when this answers an earlier request with the same Idempotency-Key.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResource'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TransferConflictProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '428':
          description: Precondition Required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/custody-transfers/{id}/reject':
    post:
      tags:
        - CustodyTransfers
      summary: The recipient refuses custody; it stays where it was.
      description: Same If-Match and Idempotency-Key rules as accept.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          description: A new UUID for each distinct write; resend the same one to retry safely.
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          description: 'The ETag of the resource as last read, quotes included; a newer version answers 409.'
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTransferBody'
          text/json:
            schema:
              $ref: '#/components/schemas/RejectTransferBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RejectTransferBody'
        required: true
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: The resource's version; send it back as If-Match.
              schema:
                type: string
            Idempotent-Replayed:
              description: '"true" when this answers an earlier request with the same Idempotency-Key.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResource'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TransferConflictProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '428':
          description: Precondition Required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  /api/v1/evidence:
    get:
      tags:
        - Evidence
      summary: 'Lists evidence by its latest custody event, one page at a time.'
      parameters:
        - name: q
          in: query
          description: Code prefix (e.g. EML2026) or text in the description.
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - name: type
          in: query
          description: 'LOG, CSV or EML.'
          schema:
            type: string
        - name: custodianId
          in: query
          description: Only evidence this user holds now.
          schema:
            maximum: 2147483647
            minimum: 1
            type: integer
            format: int32
        - name: status
          in: query
          description: 'Only evidence whose last verification found it Unverified, Valid or Invalid.'
          schema:
            $ref: '#/components/schemas/IntegrityStatus'
        - name: sort
          in: query
          description: lastEventAt:desc (default) or lastEventAt:asc.
          schema:
            enum:
              - lastEventAt:desc
              - lastEventAt:asc
            type: string
        - name: cursor
          in: query
          description: 'The nextCursor or prevCursor of a page, sent with the same filters and sort.'
          schema:
            maxLength: 64
            minLength: 0
            type: string
        - name: limit
          in: query
          description: 'Rows per page, 1 to 50.'
          schema:
            maximum: 50
            minimum: 1
            type: integer
            format: int32
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPageResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/evidence/{id}':
    get:
      tags:
        - Evidence
      summary: 'One evidence: content, custodians, integrity, the transfer waiting on its recipient and any anomalies.'
      parameters:
        - name: id
          in: path
          description: 'The evidence code, e.g. LOG202609110007.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDetail'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/evidence/{id}/chain':
    get:
      tags:
        - Evidence
      summary: 'The custody timeline: every event in sequence order, with its MAC.'
      parameters:
        - name: id
          in: path
          description: 'The evidence code, e.g. LOG202609110007.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceChainView'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/evidence/{id}/chain/verify':
    get:
      tags:
        - Evidence
      summary: 'Verifies the chain now: whether it is intact and, if not, the first invalid event and why.'
      description: "Recomputes every MAC, checks the content against the hash committed at registration and the stored rows against\nthe signed events. The result is recorded as the evidence's integrity status unless the chain grew meanwhile."
      parameters:
        - name: id
          in: path
          description: 'The evidence code, e.g. LOG202609110007.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReport'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  /api/v1/people:
    get:
      tags:
        - People
      summary: 'Lists users by display name, optionally only one role (e.g. the custodians a transfer can go to).'
      parameters:
        - name: role
          in: query
          description: 'Investigador, Custodio or Supervisor, spelled exactly.'
          schema:
            enum:
              - Investigador
              - Custodio
              - Supervisor
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  /api/v1/auth/token:
    post:
      tags:
        - Auth
      summary: Signs in as a seeded demo user and returns a bearer token.
      description: 'Demo sign-in, no password. The role comes from the seeded user, never from the request.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before trying again; nothing was done.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AcceptTransferBody:
      type: object
      properties:
        notes:
          type:
            - 'null'
            - string
          description: 'Optional notes on receipt: up to 500 characters.'
    AnomalySeverity:
      enum:
        - Medium
        - High
    AnomalyView:
      required:
        - transferId
        - kind
        - severity
        - requestedAtUtc
        - elapsedSeconds
        - deadlineSeconds
        - explanation
      type: object
      properties:
        transferId:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/TransferAnomalyKind'
        severity:
          $ref: '#/components/schemas/AnomalySeverity'
        requestedAtUtc:
          type: string
          format: date-time
        elapsedSeconds:
          type: integer
          format: int64
        deadlineSeconds:
          type: integer
          format: int64
        explanation:
          type: string
    ChainEventView:
      required:
        - eventId
        - seq
        - kind
        - occurredAtUtc
        - actor
        - from
        - to
        - transferId
        - notes
        - keyId
        - mac
        - prevMac
      type: object
      properties:
        eventId:
          type: integer
          format: int64
        seq:
          type: integer
          format: int32
        kind:
          $ref: '#/components/schemas/CustodyEventKind'
        occurredAtUtc:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/PersonRef'
        from:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PersonRef'
        to:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PersonRef'
        transferId:
          type:
            - 'null'
            - integer
          format: int64
        notes:
          type: string
        keyId:
          type: string
        mac:
          type: string
        prevMac:
          type:
            - 'null'
            - string
    ContentSummary:
      required:
        - sha256
        - byteLength
        - mediaType
      type: object
      properties:
        sha256:
          type: string
        byteLength:
          type: integer
          format: int32
        mediaType:
          type: string
    CustodyEventKind:
      enum:
        - EvidenceRegistered
        - TransferRequested
        - TransferAccepted
        - TransferRejected
    EvidenceChainView:
      required:
        - code
        - events
      type: object
      properties:
        code:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/ChainEventView'
    EvidenceDetail:
      required:
        - code
        - typeCode
        - description
        - capturedAtUtc
        - registeredAtUtc
        - registeredBy
        - initialCustodian
        - currentCustodian
        - eventCount
        - lastEventAtUtc
        - content
        - integrity
        - pendingTransfer
        - anomalies
      type: object
      properties:
        code:
          type: string
        typeCode:
          type: string
        description:
          type: string
        capturedAtUtc:
          type: string
          format: date-time
        registeredAtUtc:
          type: string
          format: date-time
        registeredBy:
          $ref: '#/components/schemas/PersonRef'
        initialCustodian:
          $ref: '#/components/schemas/PersonRef'
        currentCustodian:
          $ref: '#/components/schemas/PersonRef'
        eventCount:
          type: integer
          format: int32
        lastEventAtUtc:
          type: string
          format: date-time
        content:
          $ref: '#/components/schemas/ContentSummary'
        integrity:
          $ref: '#/components/schemas/IntegritySummary'
        pendingTransfer:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TransferView'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/AnomalyView'
    EvidenceSummary:
      required:
        - code
        - typeCode
        - description
        - currentCustodian
        - lastEventAtUtc
        - eventCount
        - integrityStatus
        - integrityCheckedAtUtc
        - pendingTransfer
      type: object
      properties:
        code:
          type: string
        typeCode:
          type: string
        description:
          type: string
        currentCustodian:
          $ref: '#/components/schemas/PersonRef'
        lastEventAtUtc:
          type: string
          format: date-time
        eventCount:
          type: integer
          format: int32
        integrityStatus:
          $ref: '#/components/schemas/IntegrityStatus'
        integrityCheckedAtUtc:
          type:
            - 'null'
            - string
          format: date-time
        pendingTransfer:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PendingTransferSummary'
    InboxPageResponse:
      required:
        - items
        - nextCursor
        - prevCursor
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceSummary'
        nextCursor:
          type:
            - 'null'
            - string
        prevCursor:
          type:
            - 'null'
            - string
      description: A page of the inbox. nextCursor is null on the last page and prevCursor is null on the first.
    IntegrityStatus:
      enum:
        - Unverified
        - Valid
        - Invalid
    IntegritySummary:
      required:
        - status
        - checkedAtUtc
        - checkedThroughSeq
      type: object
      properties:
        status:
          $ref: '#/components/schemas/IntegrityStatus'
        checkedAtUtc:
          type:
            - 'null'
            - string
          format: date-time
        checkedThroughSeq:
          type:
            - 'null'
            - integer
          format: int32
    InvalidEvent:
      required:
        - eventId
        - seq
        - reason
        - detail
      type: object
      properties:
        eventId:
          type:
            - 'null'
            - integer
          format: int64
        seq:
          type: integer
          format: int32
        reason:
          type: string
        detail:
          type: string
    PendingTransferSummary:
      required:
        - transferId
        - toCustodianId
        - sinceUtc
      type: object
      properties:
        transferId:
          type: integer
          format: int64
        toCustodianId:
          type: integer
          format: int32
        sinceUtc:
          type: string
          format: date-time
    PersonRef:
      required:
        - id
        - displayName
      type: object
      properties:
        id:
          type: integer
          format: int32
        displayName:
          type: string
    PersonSummary:
      required:
        - id
        - displayName
        - role
      type: object
      properties:
        id:
          type: integer
          format: int32
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
    RejectTransferBody:
      required:
        - reason
      type: object
      properties:
        reason:
          type: string
          description: 'Why custody is refused: 3 to 500 characters.'
