# Reproducible local stack: SQL Server 2025 -> one-shot migrate/seed -> API -> SPA.
# Dev-only credentials (marked DevOnly); override them in .env, see .env.example.
name: evidence-chain

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64 # amd64-only image; Apple Silicon runs it under Rosetta
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DevOnly_Passw0rd!2026}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # $$ defers expansion to the container's shell.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    environment:
      ADMIN_CONNECTION: Server=mssql,1433;Database=EvidenceChain;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DevOnly_Passw0rd!2026};Encrypt=True;TrustServerCertificate=True
      APP_DB_LOGIN: evidence_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-DevOnly_AppPassw0rd!2026}
    depends_on:
      mssql:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: src/EvidenceChain.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=mssql,1433;Database=EvidenceChain;User Id=evidence_app;Password=${APP_DB_PASSWORD:-DevOnly_AppPassw0rd!2026};Encrypt=True;TrustServerCertificate=True
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

volumes:
  mssql-data:
